name: PR Images Preview

on:
  workflow_run:
    workflows: [ "Generate graphics" ]
    types:
      - completed
    branches-ignore:
      - 'main'

concurrency:
  group: "workflow = ${{ github.workflow }}"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Download PR number artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pr_number

      - name: Store PR id as variable
        id: pr
        run: |
          echo "id=$(<pr_number)" >> $GITHUB_OUTPUT
          rm pr_number

      - name: Download images artifact
        id: download-images
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: images
          skip-decompress: true

      - name: Check if images artifact existed for download
        id: check-images
        run: |
          if [ "${{ steps.download-images.outcome }}" == "success" ]; then
            echo "images_changed=true" >> $GITHUB_OUTPUT
            echo "Images artifact found"
          else
            echo "images_changed=false" >> $GITHUB_OUTPUT
            echo "No images artifact found - no changes to preview"
          fi

      - name: Set up preview branch
        if: steps.check-images.outputs.images_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin
          # Create/reset pr-images branch from current HEAD and force push
          git checkout -B pr-images
          git push origin pr-images --force

      - name: Extract images artifact
        if: steps.check-images.outputs.images_changed == 'true'
        run: |
          rm -rf images/tuned
          unzip -q images.zip -d images/tuned
          rm images.zip

      - name: Push to temporary branch
        if: steps.check-images.outputs.images_changed == 'true'
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stage all changes in images/tuned (including deletions)
          git add -A images/tuned/
          
          DIFF=$(git diff --cached --name-status)
          
           # Changed SVGs
          CHANGED=$(echo "$DIFF" \
            | grep -E '^M\s+images/.*\.svg' \
            | awk '{print $2}')
          
          # Added SVGs
          ADDED=$(echo "$DIFF" \
            | grep -E '^A\s+images/tuned/.*\.svg' \
            | awk '{print $2}')
          
          # Removed SVGs
          REMOVED=$(echo "$DIFF" \
            | grep -E '^D\s+images/tuned/.*\.svg' \
            | awk '{print $2}')

          # Renamed SVGs: old -> removed, new -> added
          RENAMED_OLD=$(echo "$DIFF" \
            | grep -E '^R[0-9]*\s+images/tuned/.*\.svg\s+images/tuned/.*\.svg' \
            | awk '{print $2}')
          
          RENAMED_NEW=$(echo "$DIFF" \
            | grep -E '^R[0-9]*\s+images/tuned/.*\.svg\s+images/tuned/.*\.svg' \
            | awk '{print $3}')

          # Merge lists and convert to comma-separated
          ADDED=$(printf "%s\n%s" "$ADDED" "$RENAMED_NEW" | sed '/^$/d' | paste -sd "," -)
          REMOVED=$(printf "%s\n%s" "$REMOVED" "$RENAMED_OLD" | sed '/^$/d' | paste -sd "," -)

          CHANGED=$(printf "%s" "$CHANGED" | sed '/^$/d' | paste -sd "," -)

          echo Files changed: $CHANGED
          echo Files added: $ADDED
          echo Files removed: $REMOVED
          
          echo "svgs_changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "svgs_added=$ADDED" >> $GITHUB_OUTPUT
          echo "svgs_removed=$REMOVED" >> $GITHUB_OUTPUT

          git commit -m "Images for #${{ steps.pr.outputs.id }}" || echo "No changes to commit"
          git push origin -u pr-images --force

      - name: Capture most recent hash on branch
        if: steps.check-images.outputs.images_changed == 'true'
        id: hash
        run: |
          echo "hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Prepare markdown for changed SVGs
        if: steps.check-images.outputs.images_changed == 'true' && steps.push.outputs.svgs_changed != ''
        id: svgs_changed_md
        run: |
          HASH=${{ steps.hash.outputs.hash }}
          FILES="${{ steps.push.outputs.svgs_changed }}"
          BAR_FILES=$(echo "$FILES" | tr ',' '\n' | grep -v "memory" | grep -v "main"  | grep -v "composite" | head -n2)
          CUBE_FILES=$(echo "$FILES" | tr ',' '\n' | grep "memory" | grep -v "main" | grep -v "composite" | head -n2)
          COMPOSITE_FILES=$(echo "$FILES" | tr ',' '\n' | grep "composite" | grep -v "main" | head -n2)
          SUBSET_BAR_FILES=$(echo "$FILES" | tr ',' '\n' | grep -v "memory" | grep "main" | grep -v "composite" | head -n2)
          SUBSET_CUBE_FILES=$(echo "$FILES" | tr ',' '\n' | grep "memory" | grep "main" | grep -v "composite" | head -n2)
          SUBSET_COMPOSITE_FILES=$(echo "$FILES" | tr ',' '\n' | grep "composite" | grep -v "memory" | grep "main" | head -n2)
          BIN_PACKING_FILES=$(echo "$FILES" | tr ',' '\n' | grep "density-by-rss" | grep "main" | head -n2)
          MD=""
          for f in $SUBSET_COMPOSITE_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          for f in $SUBSET_BAR_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          for f in $SUBSET_CUBE_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
           for f in $COMPOSITE_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          for f in $BAR_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          for f in $CUBE_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          for f in $BIN_PACKING_FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          {
            echo "svgs_changed_md<<EOF"
            echo -e "$MD"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Prepare markdown for added SVGs
        if: steps.check-images.outputs.images_changed == 'true' && steps.push.outputs.svgs_added != ''
        id: svgs_added_md
        run: |
          HASH=${{ steps.hash.outputs.hash }}
          FILES="${{ steps.push.outputs.svgs_added }}"
          FILES=$(echo "$FILES" | tr ',' '\n' | head -n4)
          MD=""
          for f in $FILES; do
            MD="$MD  \n-![$f](../blob/$HASH/$f?raw=true)\n"
          done
          {
            echo "svgs_added_md<<EOF"
            echo -e "$MD"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Prepare markdown for removed SVGs
        if: steps.check-images.outputs.images_changed == 'true' && steps.push.outputs.svgs_removed != ''
        id: svgs_removed_md
        run: |
          FILES="${{ steps.push.outputs.svgs_removed }}"
          MD="#### Some files will no longer be generated:"
          for f in $(echo "$FILES" | tr ',' '\n'); do
            MD="$MD  \n- $f"
          done
          {
            echo "svgs_removed_md<<EOF"
            echo -e "$MD"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update PR status comment with link
        if: steps.check-images.outputs.images_changed == 'true'
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            🚀 This is what some of the generated images would look like with this change. You can browse the full set on [the preview branch](../blob/${{ steps.hash.outputs.hash }}/images/).

            ${{ steps.svgs_changed_md.outputs.svgs_changed_md }}
            ${{ steps.svgs_added_md.outputs.svgs_added_md }}
            ${{ steps.svgs_removed_md.outputs.svgs_removed_md }}
          pr-number: ${{ steps.pr.outputs.id }}

      - name: Update PR status comment with absence of link
        if: steps.check-images.outputs.images_changed == 'false'
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: This PR would not change any of the generated images.
          pr-number: ${{ steps.pr.outputs.id }}
